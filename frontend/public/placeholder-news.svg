<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2530" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EB412F" />
      <stop offset="100%" stop-color="#9E1B10" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D423" />
      <stop offset="100%" stop-color="#FF4E50" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo base -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Acentos decorativos de emergencia -->
  <circle cx="600" cy="270" r="180" fill="#EB412F" opacity="0.08" filter="blur(40px)" />
  <rect x="0" y="667" width="1200" height="8" fill="url(#fireGrad)" />

  <!-- Escudo Institucional Central -->
  <g transform="translate(540, 160)">
    <!-- Escudo Exterior -->
    <path d="M 60 6 Q 102 6 108 42 Q 108 90 60 114 Q 12 90 12 42 Q 18 6 60 6 Z" fill="url(#fireGrad)" stroke="#B71C1C" stroke-width="2.5"/>
    <path d="M 60 12 Q 96 12 100 44 Q 100 84 60 105 Q 20 84 20 44 Q 24 12 60 12 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Hachas cruzadas -->
    <line x1="33" y1="33" x2="87" y2="87" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="87" y1="33" x2="33" y2="87" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="31,28 42,24 40,38 28,36" fill="#FFC107"/>
    <polygon points="89,28 78,24 80,38 92,36" fill="#FFC107"/>
    <!-- Casco central -->
    <ellipse cx="60" cy="62" rx="24" ry="14" fill="#FFFFFF"/>
    <path d="M 40 60 C 40 40 80 40 80 60 Z" fill="#222222"/>
    <path d="M 55 43 L 65 43 L 62 55 L 58 55 Z" fill="#FFC107"/>
    <!-- Texto 1883 -->
    <text x="60" y="96" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-size="10.5" fill="#FFFFFF" letter-spacing="1">1883</text>
  </g>

  <!-- Tipografía Institucional -->
  <text x="600" y="360" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" letter-spacing="3">
    CUERPO DE BOMBEROS DE SAN FELIPE
  </text>
  <text x="600" y="400" text-anchor="middle" font-family="'Roboto', sans-serif" font-weight="500" font-size="17" fill="#EB412F" letter-spacing="1.5">
    ABNEGACIÓN Y CONSTANCIA • FUNDADO EL 11 DE MARZO DE 1883
  </text>
  <text x="600" y="440" text-anchor="middle" font-family="'Roboto', sans-serif" font-weight="400" font-size="14" fill="#64748B">
    Prensa Oficial &amp; Comunicaciones Institucionales
  </text>
</svg>
